name: Reusable Steam Workshop publisher

on:
  workflow_call:
    inputs:
      workshop-id:
        required: true
        type: string
      build-mode:
        default: ready
        type: string
      project-directory:
        default: '.'
        type: string
      steam-secrets-organization:
        description: Organization holding STEAM_CONFIG_VDF.
        default: ApocalipseBr
        type: string
      test-command:
        description: Optional test command run from project-directory; empty skips mod tests.
        default: ''
        type: string
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_PASSWORD:
        required: false
      STEAM_CONFIG_VDF:
        required: false
      STEAM_SESSION_GITHUB_TOKEN:
        required: false
      PZMANAGER_RESTART_URL:
        required: false
      PZMANAGER_MOD_UPDATE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out mod source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A separate checkout makes this workflow reusable from another mod repository.
      # On the radio repository it uses the exact triggering commit, including on PRs.
      - name: Check out publishing tools
        uses: actions/checkout@v4
        with:
          repository: ApocalipseBr/ApocalipseBRRadio
          ref: ${{ github.repository == 'ApocalipseBr/ApocalipseBRRadio' && github.sha || 'master' }}
          path: .workshop-tools
          persist-credentials: false
      - name: Set up Node for builds and optional mod tests
        if: inputs.build-mode == 'pzstudio' || inputs.test-command != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run optional mod unit tests
        if: inputs.test-command != ''
        env:
          PROJECT_DIRECTORY: ${{ inputs.project-directory }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          project_dir="$(python3 .workshop-tools/scripts/workshop/stage.py resolve "$GITHUB_WORKSPACE" "$PROJECT_DIRECTORY")"
          cd "$project_dir"
          bash -e -o pipefail -c "$TEST_COMMAND"
      - name: Build and stage Workshop package
        env:
          BUILD_MODE: ${{ inputs.build-mode }}
          PROJECT_DIRECTORY: ${{ inputs.project-directory }}
          WORKSHOP_ID: ${{ inputs.workshop-id }}
        run: bash .workshop-tools/scripts/workshop/package.sh
      - name: Check packaging and publisher behavior without Steam access
        run: python3 -m unittest discover -s .workshop-tools/tests -p 'workshop*_spec.py'
      - name: Validate publisher container build
        run: docker build -t pz-workshop-publisher .workshop-tools/docker/workshop
      - name: Save Workshop package
        uses: actions/upload-artifact@v4
        with:
          name: workshop-package
          path: ${{ runner.temp }}/workshop-package
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    # Never run untrusted PR code on a publisher or expose Steam credentials to it.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, pz-workshop]
    timeout-minutes: 30
    env:
      WORKSHOP_CONTAINER: pz-workshop-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: steam-workshop-account
      cancel-in-progress: false
    steps:
      - name: Check home runner prerequisites
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "::error::Install python3 on the home runner."; exit 1; }
          command -v gh >/dev/null || { echo "::error::Install GitHub CLI (gh) on the home runner."; exit 1; }
          command -v docker >/dev/null || { echo "::error::Install Docker on the home runner."; exit 1; }
          python3 -c 'import fcntl' || { echo "::error::The publishing worker requires Linux file locking."; exit 1; }
          docker info >/dev/null 2>&1 || { echo "::error::Start Docker and grant the runner user access to its daemon."; exit 1; }
      - name: Check out publishing tools
        uses: actions/checkout@v4
        with:
          repository: ApocalipseBr/ApocalipseBRRadio
          ref: ${{ github.repository == 'ApocalipseBr/ApocalipseBRRadio' && github.sha || 'master' }}
          path: .workshop-tools
          persist-credentials: false
      - name: Restore Workshop package
        uses: actions/download-artifact@v4
        with:
          name: workshop-package
          path: ${{ runner.temp }}/workshop-package
      - name: Validate restart integration configuration
        env:
          PZMANAGER_RESTART_URL: ${{ secrets.PZMANAGER_RESTART_URL }}
          PZMANAGER_MOD_UPDATE_TOKEN: ${{ secrets.PZMANAGER_MOD_UPDATE_TOKEN }}
        run: python3 .workshop-tools/scripts/workshop/request_restart.py --validate-only
      - name: Validate remembered Steam login and secret writer
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          GH_TOKEN: ${{ secrets.STEAM_SESSION_GITHUB_TOKEN }}
          STEAM_SECRETS_ORGANIZATION: ${{ inputs.steam-secrets-organization }}
        run: python3 .workshop-tools/scripts/workshop/steam_session.py --validate-only
      - name: Publish existing Workshop item
        id: steam
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          WORKSHOP_ID: ${{ inputs.workshop-id }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.STEAM_SESSION_GITHUB_TOKEN }}
          STEAM_SECRETS_ORGANIZATION: ${{ inputs.steam-secrets-organization }}
        run: |
          set -euo pipefail
          if [[ -z "$STEAM_USERNAME" || -z "$STEAM_CONFIG_VDF" ]]; then
            echo "::error::Grant this repository access to STEAM_USERNAME and STEAM_CONFIG_VDF."
            exit 1
          fi
          docker build -t pz-workshop-publisher .workshop-tools/docker/workshop
          python3 .workshop-tools/scripts/workshop/run_publisher.py
      - name: Request server restart after successful Steam publish
        if: always() && !cancelled() && steps.steam.outputs.publication == 'confirmed'
        env:
          PZMANAGER_RESTART_URL: ${{ secrets.PZMANAGER_RESTART_URL }}
          PZMANAGER_MOD_UPDATE_TOKEN: ${{ secrets.PZMANAGER_MOD_UPDATE_TOKEN }}
        run: python3 .workshop-tools/scripts/workshop/request_restart.py
      - name: Remove session data and staged files
        if: always()
        run: |
          docker rm -f "$WORKSHOP_CONTAINER" >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/steam-session" "$RUNNER_TEMP/workshop-package"
